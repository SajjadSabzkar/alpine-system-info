insmod all_video
insmod part_msdos
insmod part_gpt
insmod fat
insmod ext2
insmod iso9660

set default=0
set timeout=5

menuentry "SysInfo Live - Auto Collect & Shutdown" {
    linux /boot/vmlinuz-lts boot=live modules=loop,squashfs,sd-mod,usb-storage quiet loglevel=3
    initrd /boot/initramfs-live
}

menuentry "SysInfo Live - Verbose Boot (Debug)" {
    linux /boot/vmlinuz-lts boot=live modules=loop,squashfs,sd-mod,usb-storage loglevel=4
    initrd /boot/initramfs-live
}

menuentry "SysInfo Live - Interactive (no auto-shutdown)" {
    linux /boot/vmlinuz-lts boot=live modules=loop,squashfs,sd-mod,usb-storage quiet
    initrd /boot/initramfs-live
}
