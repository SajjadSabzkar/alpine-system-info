name: Build SysInfo Live USB

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            xorriso grub-pc-bin grub-efi mtools make python3 \
            dosfstools e2fsprogs squashfs-tools python3-yaml \
            gcc wget curl unzip xz-utils zstd git

      - name: Setup teaiso
        run: |
          git clone https://gitlab.com/tearch-linux/applications-and-tools/teaiso
          cd teaiso
          sudo make && sudo make install

      - name: Build ISO
        run: sudo bash build.sh

      - name: Get current date
        id: get_date
        run: echo "date=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: "build-${{ steps.get_date.outputs.date }}"
          name: "SysInfo Live USB - ${{ steps.get_date.outputs.date }}"
          body: |
            SysInfo Live USB - System Information Collector
            
            Username: live
            Password: live
            
            Boot from USB to automatically collect system info.
          artifacts: "output/*"
          makeLatest: true
